<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- background -->
  <rect width="192" height="192" rx="32" fill="#0A1628"/>
  <!-- honeycomb cluster centered in icon -->
  <!-- scale logo to fit: original cluster ~182px tall, icon 192px, scale ~0.85, center at 96,96 -->
  <!-- cell centers in original: A=(-46,0) B=(46,0) C=(0,78), translate to (96,70) -->
  <g transform="translate(96,70)">
    <!-- CELL A: left -->
    <g transform="translate(-38,0)">
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="#0E7EC4"/>
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#0A4F80"/>
      <line x1="27" y1="-18" x2="27" y2="18" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2" y1="32" x2="-29" y2="15" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-29" y1="-15" x2="2" y2="-32" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="none" stroke="#40E0FF" stroke-width="2.5"/>
    </g>
    <!-- CELL B: right -->
    <g transform="translate(38,0)">
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="#0BBFB0"/>
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#077A74"/>
      <line x1="27" y1="-18" x2="27" y2="18" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2" y1="32" x2="-29" y2="15" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-29" y1="-15" x2="2" y2="-32" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="none" stroke="#40E0FF" stroke-width="2.5"/>
    </g>
    <!-- CELL C: bottom -->
    <g transform="translate(0,65)">
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="#06304A"/>
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#0A4A6A"/>
      <line x1="27" y1="-18" x2="27" y2="18" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2" y1="32" x2="-29" y2="15" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-29" y1="-15" x2="2" y2="-32" stroke="#7FFFEF" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,-43 37,-22 37,22 0,43 -37,22 -37,-22" fill="none" stroke="#40E0FF" stroke-width="2.5"/>
    </g>
  </g>
  <!-- 3: absolute at cell C center = (96, 70+65) = (96,135) -->
  <text x="96" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="700" fill="#40E0FF" text-anchor="middle">3</text>
</svg>
